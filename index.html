<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handleliste</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      margin: 0;
      padding: 30px 20px;
      color: #111827;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 38px;
      margin: 20px 0 30px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      min-width: 0;
      font-size: 18px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      outline: none;
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .add-button {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #22a65a;
      color: white;
      font-size: 30px;
    }

    .item {
      display: flex;
      align-items: center;
      background: white;
      padding: 17px;
      margin-bottom: 8px;
      border-radius: 14px;
      font-size: 19px;
    }

    .check {
      width: 25px;
      height: 25px;
      border: 2px solid #aaa;
      border-radius: 50%;
      margin-right: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      cursor: pointer;
    }

    .done .check {
      background: #22a65a;
      border-color: #22a65a;
    }

    .done .item-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete {
      background: none;
      color: #aaa;
      font-size: 26px;
      padding: 0 5px;
    }

    .empty {
      text-align: center;
      color: #999;
      margin-top: 80px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Handleliste</h1>

    <div class="input-row">
      <input
        id="input"
        type="text"
        placeholder="Legg til vare ..."
        autocomplete="off"
      >

      <button class="add-button" onclick="addItem()">+</button>
    </div>

    <div id="list"></div>

  </div>

  <script>
    let items =
      JSON.parse(localStorage.getItem("handleliste")) || [];

    function save() {
      localStorage.setItem(
        "handleliste",
        JSON.stringify(items)
      );
    }

    function render() {
      const list = document.getElementById("list");

      list.innerHTML = "";

      if (items.length === 0) {
        list.innerHTML =
          '<div class="empty">Listen er tom</div>';

        return;
      }

      items.forEach((item, index) => {

        const row = document.createElement("div");

        row.className =
          "item" + (item.done ? " done" : "");

        row.innerHTML = `
          <div
            class="check"
            onclick="toggleItem(${index})">
          </div>

          <div
            class="item-text"
            onclick="toggleItem(${index})">
            ${item.name}
          </div>

          <button
            class="delete"
            onclick="deleteItem(${index})">
            ×
          </button>
        `;

        list.appendChild(row);
      });
    }

    function addItem() {
      const input =
        document.getElementById("input");

      const name = input.value.trim();

      if (!name) {
        return;
      }

      items.push({
        name: name,
        done: false
      });

      input.value = "";

      save();
      render();

      input.focus();
    }

    function toggleItem(index) {
      items[index].done =
        !items[index].done;

      save();
      render();
    }

    function deleteItem(index) {
      items.splice(index, 1);

      save();
      render();
    }

    document
      .getElementById("input")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            addItem();
          }

        }
      );

    render();
  </script>

</body>
</html>
