<!DOCTYPE html>

<html lang="no">

<head>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FBE7A3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png.PNG">
  
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Handleliste</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      padding: 24px 18px;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background: #FBE7A3;

      color: #25332a;

    }

    .app {

      max-width: 480px;

      margin: 0 auto;
padding-bottom: 100px;
    }

    .top-label {

      font-size: 13px;

      color: #829087;

      margin-bottom: 5px;

    }

    .list-header {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 18px;

    }

    #current-name {

      font-size: 27px;

      font-weight: 650;

      margin: 0;

      flex: 1;

    }

    button {

      font: inherit;

      cursor: pointer;

    }

.lists-button {
  border: 0;
  background: transparent;
  color: #5f604f;
  padding: 8px 4px;
  border-radius: 0;
  font-size: 15px;
}

    .input-row {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: calc(100% - 36px);
  max-width: 480px;

  display: flex;
  gap: 8px;

  padding: 10px;
  margin: 0;

  background: rgba(255, 255, 255, 0.75);
  border-radius: 18px;
  z-index: 20;
}

#suggestions {
  position: fixed;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  width: calc(100% - 56px);
  max-width: 460px;

  margin: 0;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  z-index: 21;
} 

.suggestion {
  padding: 12px 16px;
  font-size: 15px;
  border-bottom: 1px solid #edf0ed;
  cursor: pointer;
}

.suggestion:last-child {
  border-bottom: none;
}

.suggestion:active {
  background: #edf4ed;
}
    
    #item-input {

      flex: 1;

      min-width: 0;

      padding: 14px 16px;

      font-size: 16px;

      border: 0;

      border-radius: 16px;

      outline: none;

      background: #FFF8E6;

    }

    .add-button {

      width: 49px;

      height: 49px;

      border: 0;

      border-radius: 16px;

      background: #FFF8E6;
      color: #292719;
      
      font-size: 25px;

    }

.item {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 4px 4px;
  margin-bottom: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
}

    .check {

      width: 22px;

      height: 22px;

      border: 1.5px solid #9ca9a0;

      border-radius: 50%;

      margin-right: 13px;

      flex-shrink: 0;

    }

    .item-text {

      flex: 1;

      font-size: 21px;

    }

    .done .check {

      background: #72a67e;

      border-color: #72a67e;

    }

    .done .item-text {

      text-decoration: line-through;

      color: #a2aaa5;

    }

    .delete-item, .delete-list {

      border: 0;

      background: none;

      color: #aab2ac;

      font-size: 22px;

    }

    .empty, .status {

      text-align: center;

      color: #9aa59e;

      font-size: 14px;

      margin-top: 65px;

    }

    .overlay {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(35,48,40,.18);

      padding: 20px;

      align-items: center;

      justify-content: center;

    }

    .overlay.open { display: flex; }

    .panel {

      width: 100%;

      max-width: 430px;

      background: #fbfcfa;

      border-radius: 20px;

      padding: 22px;

      box-shadow: 0 15px 50px rgba(40,60,45,.15);

    }

    .panel h2 {

      font-size: 20px;

      margin: 0 0 18px;

    }

    .list-choice {

      display: flex;

      align-items: center;

      padding: 12px 4px;

      border-bottom: 1px solid #edf0ed;

    }

    .list-choice-name {

      flex: 1;

      font-size: 15px;

      cursor: pointer;

    }

    .active-list {

      font-weight: 600;

      color: #52785d;

    }

    .new-list {

      display: flex;

      gap: 8px;

      margin-top: 20px;

    }

    #new-list-input {

      flex: 1;

      min-width: 0;

      padding: 12px;

      border: 1px solid #dde5dd;

      border-radius: 11px;

      font-size: 15px;

    }

    .create-button {

      border: 0;

      border-radius: 11px;

      background: #72a67e;

      color: white;

      padding: 0 16px;

    }

    .close-button {

      width: 100%;

      margin-top: 18px;

      padding: 11px;

      border: 0;

      background: #edf2ed;

      color: #526158;

      border-radius: 11px;

    }

.recipe-ingredient {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(70, 60, 35, 0.15);
  font-size: 16px;
  line-height: 1.4;
}

.recipe-ingredient input {
  flex-shrink: 0;
  margin-top: 5px;
}

    #recipe-overlay .panel {
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
    
  </style>

</head>

<body>

<div class="app">

  <div class="top-label">Handleliste</div>

  <div class="list-header">

    <h1 id="current-name">Laster...</h1>

    <button class="lists-button" onclick="openLists()">Mine lister</button>

  </div>


  <div id="items"></div>

    <div class="input-row">

    <input id="item-input" type="text" placeholder="Legg til vare ..." autocomplete="off">

    <button class="add-button" onclick="addItem()">+</button>

  </div>
  
  <div id="suggestions"></div>

  <div class="recipe-import">
  <button class="recipe-button" onclick="openRecipeImport()">
    Importer oppskrift
  </button>
</div>

</div>

<div id="overlay" class="overlay">

  <div class="panel">

    <h2>Mine lister</h2>

    <div id="list-selector"></div>

    <div class="new-list">

      <input id="new-list-input" type="text" placeholder="Navn på ny liste">

      <button class="create-button" onclick="createList()">Opprett</button>

    </div>

    <button class="close-button" onclick="closeLists()">Lukk</button>

  </div>

</div>

  <div id="recipe-overlay" class="overlay">
  <div class="panel">
    <h2>Importer oppskrift</h2>

    <input
      id="recipe-url"
      type="url"
      placeholder="Lim inn lenke til oppskrift"
    >

    <button class="create-button" onclick="fetchRecipe()">
      Hent ingredienser
    </button>

    <div id="recipe-result"></div>
    
<button
  id="add-recipe-items"
  class="create-button"
  onclick="addRecipeItems()"
  style="display: none;"
>
  Legg valgte i handlelisten
</button>
    
    <button class="close-button" onclick="closeRecipeImport()">
      Lukk
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  // ===== LIM INN DINE TO VERDIER HER =====

  const SUPABASE_URL = "https://zvplflsqkqafvywoxpto.supabase.co";

  const SUPABASE_KEY = "sb_publishable_49pWQYYc0ns9AHeCtNfYQg_R16T-ReF";

  // =======================================

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let lists = [];

  let items = [];

  let currentListId = null;

  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

  async function start() {

    await loadLists();

    if (lists.length === 0) {

      const { data, error } = await db

        .from("lists")

        .insert({ name: "Dagligvarer" })

        .select()

        .single();

      if (error) return showError(error);

      lists = [data];

    }

    currentListId = lists[0].id;

    await loadItems();

    render();

    db.channel("handleliste-live")

      .on(

        "postgres_changes",

        { event: "*", schema: "public", table: "lists" },

        async () => {

          await loadLists();

          if (!lists.some(list => list.id === currentListId)) {

            currentListId = lists[0]?.id || null;

          }

          await loadItems();

          render();

          renderListSelector();

        }

      )

      .on(

        "postgres_changes",

        { event: "*", schema: "public", table: "items" },

        async () => {

          await loadItems();

          render();

        }

      )

      .subscribe();

  }

  async function loadLists() {

    const { data, error } = await db

      .from("lists")

      .select("*")

      .order("created_at");

    if (error) return showError(error);

    lists = data || [];

  }

  async function loadItems() {

    if (!currentListId) {

      items = [];

      return;

    }

    const { data, error } = await db

      .from("items")

      .select("*")

      .eq("list_id", currentListId)

      .order("created_at");

    if (error) return showError(error);

    items = data || [];

  }

  function render() {

    const current = lists.find(list => list.id === currentListId);

    document.getElementById("current-name").textContent =

      current ? current.name : "Handleliste";

    const container = document.getElementById("items");

    container.innerHTML = "";

    if (items.length === 0) {

      container.innerHTML = '<div class="empty">Listen er tom</div>';

      return;

    }

    items.forEach(item => {

      const row = document.createElement("div");

      row.className = "item" + (item.done ? " done" : "");

      row.innerHTML = `

        <div class="check" onclick="toggleItem(${item.id}, ${item.done})"></div>

        <div class="item-text" onclick="toggleItem(${item.id}, ${item.done})">

          ${escapeHTML(item.name)}

        </div>

        <button class="delete-item" onclick="deleteItem(${item.id})">×</button>

      `;

      container.appendChild(row);

    });

  }

  async function addItem() {
  const input = document.getElementById("item-input");
  const name = input.value.trim();

  if (!name || !currentListId) return;

  input.value = "";

  // Legg varen på den aktive handlelisten
  const { error: itemError } = await db.from("items").insert({
    name: name,
    done: false,
    list_id: currentListId
  });

  if (itemError) return showError(itemError);

  // Se om varen allerede finnes i vareminnet
  const { data: existingProduct, error: findError } = await db
    .from("products")
    .select("*")
    .eq("name", name)
    .maybeSingle();

  if (findError) return showError(findError);

  if (existingProduct) {
    // Varen finnes allerede: øk telleren og oppdater sist brukt
    const { error: updateError } = await db
      .from("products")
      .update({
        use_count: existingProduct.use_count + 1,
        last_used: new Date().toISOString()
      })
      .eq("id", existingProduct.id);

    if (updateError) return showError(updateError);

  } else {
    // Første gang vi bruker denne varen
    const { error: productError } = await db
      .from("products")
      .insert({
        name: name,
        use_count: 1,
        last_used: new Date().toISOString()
      });

    if (productError) return showError(productError);
  }

  await loadItems();
  render();
  input.focus();
}

  async function toggleItem(id, done) {
  const { error } = await db
    .from("items")
    .delete()
    .eq("id", id);

  if (error) return showError(error);

  await loadItems();
  render();
}
  
  async function deleteItem(id) {

    const { error } = await db

      .from("items")

      .delete()

      .eq("id", id);

    if (error) return showError(error);

    await loadItems();

    render();

  }

  function openLists() {

    renderListSelector();

    document.getElementById("overlay").classList.add("open");

  }

  function closeLists() {

    document.getElementById("overlay").classList.remove("open");

  }

  function openRecipeImport() {
  document.getElementById("recipe-overlay").classList.add("open");
}

function closeRecipeImport() {
  document.getElementById("recipe-overlay").classList.remove("open");
}

  async function fetchRecipe() {
  const url = document.getElementById("recipe-url").value.trim();
  const result = document.getElementById("recipe-result");

  if (!url) {
    result.innerHTML = "<p>Lim inn en oppskriftslenke først.</p>";
    return;
  }

  result.innerHTML = "<p>Henter oppskrift...</p>";

  const { data, error } = await db.functions.invoke("import-recipe", {
    body: { url: url }
  });

  if (error) {
    console.error(error);
    result.innerHTML = "<p>Kunne ikke hente oppskriften.</p>";
    return;
  }

  if (data.error) {
    result.innerHTML = "<p>" + data.error + "</p>";
    return;
  }

  result.innerHTML = "";

  const title = document.createElement("h3");
  title.textContent = data.name || "Oppskrift";
  result.appendChild(title);

  data.ingredients.forEach((ingredient, index) => {
    const row = document.createElement("label");
    row.className = "recipe-ingredient";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = false;
    checkbox.value = ingredient;
    checkbox.id = "ingredient-" + index;

    const text = document.createElement("span");
    text.textContent = ingredient;

    row.appendChild(checkbox);
    row.appendChild(text);
    result.appendChild(row);
  });
    document.getElementById("add-recipe-items").style.display = "block";
}

  async function addRecipeItems() {
  const selected = document.querySelectorAll(
    "#recipe-result input[type='checkbox']:checked"
  );

  if (selected.length === 0) {
    alert("Velg minst én ingrediens.");
    return;
  }

  const rows = Array.from(selected).map(checkbox => ({
    name: checkbox.value,
    done: false,
    list_id: currentListId
  }));

  const { error } = await db
    .from("items")
    .insert(rows);

  if (error) {
    console.error(error);
    alert("Kunne ikke legge ingrediensene i handlelisten.");
    return;
  }

  await loadItems();
  render();

  document.getElementById("recipe-url").value = "";
  document.getElementById("recipe-result").innerHTML = "";
  document.getElementById("add-recipe-items").style.display = "none";

  closeRecipeImport();
}
  
  function renderListSelector() {

    const selector = document.getElementById("list-selector");

    selector.innerHTML = "";

    lists.forEach(list => {

      const row = document.createElement("div");

      row.className = "list-choice";

      const active = list.id === currentListId ? " active-list" : "";

      row.innerHTML = `

        <div class="list-choice-name${active}" onclick="selectList(${list.id})">

          ${escapeHTML(list.name)}

        </div>

        ${

          lists.length > 1

            ? `<button class="delete-list" onclick="deleteList(${list.id})">×</button>`

            : ""

        }

      `;

      selector.appendChild(row);

    });

  }

  async function createList() {

    const input = document.getElementById("new-list-input");

    const name = input.value.trim();

    if (!name) return;

    const { data, error } = await db

      .from("lists")

      .insert({ name: name })

      .select()

      .single();

    if (error) return showError(error);

    input.value = "";

    await loadLists();

    currentListId = data.id;

    await loadItems();

    render();

    closeLists();

  }

  async function selectList(id) {

    currentListId = id;

    await loadItems();

    render();

    closeLists();

  }

  async function deleteList(id) {

    if (lists.length <= 1) return;

    const { error } = await db

      .from("lists")

      .delete()

      .eq("id", id);

    if (error) return showError(error);

    await loadLists();

    if (currentListId === id) {

      currentListId = lists[0].id;

    }

    await loadItems();

    render();

    renderListSelector();

  }

  function showError(error) {

    console.error(error);

    alert("Noe gikk galt: " + error.message);

  }

  async function showSuggestions() {
  const input = document.getElementById("item-input");
  const suggestions = document.getElementById("suggestions");
  const search = input.value.trim();

  suggestions.innerHTML = "";

  let query = db
    .from("products")
    .select("*")
    .order("use_count", { ascending: false })
    .limit(5);

  // Hvis du har skrevet noe, vis bare varer som begynner med teksten
  if (search.length > 0) {
    query = query.ilike("name", search + "%");
  }

  const { data, error } = await query;

  if (error) {
    console.error(error);
    return;
  }

  data.forEach(product => {
    const suggestion = document.createElement("div");
    suggestion.className = "suggestion";
    suggestion.textContent = product.name;

    suggestion.addEventListener("click", () => {
      input.value = product.name;
      suggestions.innerHTML = "";
      addItem();
    });

    suggestions.appendChild(suggestion);
  });
}

document
  .getElementById("item-input")
  .addEventListener("input", showSuggestions);

document
  .getElementById("item-input")
  .addEventListener("focus", showSuggestions);

  document
  .getElementById("item-input")
  .addEventListener("click", showSuggestions);

  document.addEventListener("click", event => {
  const input = document.getElementById("item-input");
  const suggestions = document.getElementById("suggestions");

  if (
    !input.contains(event.target) &&
    !suggestions.contains(event.target)
  ) {
    suggestions.innerHTML = "";
  }
});
  
  document

    .getElementById("item-input")

    .addEventListener("keydown", event => {

      if (event.key === "Enter") addItem();

    });

  document

    .getElementById("new-list-input")

    .addEventListener("keydown", event => {

      if (event.key === "Enter") createList();

    });

  start();

</script>

</body>

</html>
